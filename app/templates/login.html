{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Iniciar sesión</h1>
  <p class="muted">Solicitudes de alta y cambios de permisos de la mesa de cambios.</p>
  {% if error %}<p class="alerta error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    </div>
    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
    </div>
    <button class="boton primario ancho" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
